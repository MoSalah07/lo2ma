[project]
name = "lo2ma-backend"
version = "0.0.0"
description = "Lo2ma's API: preferences, meal search, the agent, orders and weekly plans."
readme = "README.md"
# 3.15 is out, but PyYAML has no 3.15 wheels yet and fastapi-cli needs it (through uvicorn[standard]).
# Move up once it ships them, the way TypeScript waits for typescript-eslint.
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.3",
    "fastapi-cli==0.0.32",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.5",
    "starlette==1.8.0",
]

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
required-version = "==0.13.1"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: unused names, missing imports
    "I",     # import order
    "B",     # bugbear: likely bugs, such as mutable defaults
    "UP",    # newer syntax: X | None instead of Optional[X]
    "SIM",   # simpler code
    "N",     # naming
    "ASYNC", # blocking calls inside async def
    "S",     # security (bandit)
    "DTZ",   # datetimes without a timezone
    "FAST",  # FastAPI: Depends inside Annotated, and the like
    "T10",   # a forgotten breakpoint()
    "T20",   # a forgotten print()
    "RUF",   # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with plain assert.
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["app", "migrations", "tests"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
# A warning is a failure, like ESLint's zero warnings.
filterwarnings = ["error"]

# Settings only: the database URL comes from LO2MA_DATABASE_URL (migrations/env.py), so there is no alembic.ini.
[tool.alembic]
script_location = "%(here)s/migrations"
# 2026_10_18_1a2b3c4d5e6f_add_places.py: the file explorer lists them by date.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
timezone = "UTC"
truncate_slug_length = 40

# A new migration comes out lint-clean and formatted, so the check passes on it as generated.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
